<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SplitIt Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,500&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a plain bookkeeping ledger inside a real app shell (sidebar on desktop, tab bar on phones). Biro blue for actions, red pen for debts, highlighter for new entries. */
:root{
  --paper:#F5F5F1;--sheet:#FDFDFB;--ink:#1B1B1A;--muted:#66665F;--rule:#D8D8D0;
  --biro:#1E3FB8;--biro-ink:#FFFFFF;--red:#B8231D;--mark:#FFEE9A;--wash:#ECECE5;
  --display:'Newsreader',Georgia,serif;--body:'Hanken Grotesk',system-ui,sans-serif;--mono:'Spline Sans Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#151615;--sheet:#1C1D1C;--ink:#ECEBE4;--muted:#A0A099;--rule:#34352F;--biro:#8EA4FF;--biro-ink:#10131f;--red:#FF7B70;--mark:#4D4519;--wash:#262725;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#151615;--sheet:#1C1D1C;--ink:#ECEBE4;--muted:#A0A099;--rule:#34352F;--biro:#8EA4FF;--biro-ink:#10131f;--red:#FF7B70;--mark:#4D4519;--wash:#262725;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:64px}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}button{font:inherit;color:inherit;cursor:pointer}
em{font-family:var(--display)}
.mono,.fig,.amt{font-family:var(--mono);font-variant-numeric:tabular-nums}
.amt{font-size:.92em}
:focus-visible{outline:2px solid var(--biro);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
.r{text-align:right}
.neg{color:var(--red)}.pos{font-weight:500}

/* shells */
#shell{position:relative}
#shell.phone{width:392px;height:min(840px,calc(100vh - 130px));margin:14px auto;border:10px solid var(--ink);border-radius:38px;overflow:hidden;transform:translateZ(0);display:flex;flex-direction:column;background:var(--paper)}
#scroll{container:shell/inline-size;display:flex;flex-direction:column;min-height:100vh}
#shell.phone #scroll{min-height:0;flex:1;overflow:auto}
#app{flex:1;display:flex;flex-direction:column;min-width:0}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);flex:1}
.side{border-right:1.5px solid var(--ink);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;align-self:start}
.side .brand{margin:0 10px 22px;text-align:left}
.navi,.tabi{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;text-align:left;font-weight:600;color:var(--muted);border-left:3px solid transparent}
.navi:hover{color:var(--ink);background:var(--wash)}
.navi[aria-current="page"]{color:var(--ink);border-color:var(--biro);background:var(--wash)}
.navi svg,.tabi svg{width:20px;height:20px;flex:none}
.me2{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 10px 4px;border-top:1px solid var(--rule)}
.main{min-width:0;padding:0 30px 60px}
.mtop{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);z-index:15}
.mbrand{display:none}
.searchbtn{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;border:1.5px solid var(--ink);background:var(--sheet);padding:9px 12px;border-radius:3px;color:var(--muted);text-align:left}
.searchbtn svg{width:18px;height:18px;flex:none}
.searchbtn kbd{margin-left:auto;font-family:var(--mono);font-size:.75rem;border:1px solid var(--muted);padding:0 6px;border-radius:2px}
.tabbar{display:none}
.content{padding-top:26px}

/* buttons + fields */
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:3px;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--wash)}
.btn-primary{background:var(--biro);border-color:var(--biro);color:var(--biro-ink)}
.btn-primary:hover{background:var(--biro);filter:brightness(1.12)}
.btn-link{border:0;background:none;padding:0;color:var(--biro);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.btn-link:hover{background:none;text-decoration-thickness:2px}
.btn-danger{background:var(--red);border-color:var(--red);color:var(--biro-ink)}
.btn-danger:hover{background:var(--red);filter:brightness(1.1)}
.btn-big{padding:15px 30px;font-size:1.05rem;width:min(420px,100%);justify-content:center}
.btn[disabled]{opacity:.55;pointer-events:none}
label,.lbl{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin:18px 0 2px;letter-spacing:.02em}
.field{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;padding:8px 2px}
.field:focus{outline:none;background:var(--wash);border-bottom-color:var(--biro)}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 7px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.money{display:flex;align-items:baseline;border-bottom:1.5px solid var(--ink)}
.money>span{font-family:var(--mono);color:var(--muted);padding-right:4px}
.money input{width:100%;font:inherit;font-family:var(--mono);color:var(--ink);background:transparent;border:0;padding:8px 2px}
.money input:focus{outline:none}.money:focus-within{border-bottom-color:var(--biro);background:var(--wash)}
.money.sm{width:130px}.money.sm input{padding:3px 2px}
.err{color:var(--red);font-size:.9rem;min-height:1.4em;margin-top:10px}
.hint,.tiny{color:var(--muted);font-size:.88rem;margin-top:8px}
.theme{display:inline-flex;align-items:center;gap:7px;background:none;border:1.5px solid var(--ink);border-radius:3px;padding:7px 10px;font-size:.85rem;font-weight:600;white-space:nowrap}
.theme:hover{background:var(--wash)}.theme svg{width:15px;height:15px}

/* avatars */
.av{--s:32px;width:var(--s);height:var(--s);border-radius:50%;border:1.5px solid var(--ink);overflow:hidden;display:inline-block;flex:none;background:var(--wash);vertical-align:middle}
.av svg,.av img{width:100%;height:100%;display:block;object-fit:cover}
.av.sm{--s:24px}.av.lg{--s:44px}.av.xl{--s:84px;border-width:2px}
.avs{display:inline-flex}.avs .av+.av{margin-left:-8px}
.who{display:inline-flex;align-items:center;gap:8px}

.brand{background:none;border:0;padding:0;font-family:var(--display);font-size:1.6rem;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.brand em{font-style:italic;font-weight:400;color:var(--biro)}
.eyebrow{color:var(--muted);font-size:.9rem}
.greet{font-size:clamp(2rem,5vw,3rem);font-weight:400;line-height:1.1}
.fig{display:inline-block;font-size:.8em;font-weight:500;border-bottom:3px double currentColor;line-height:1.15}
.line{font-family:var(--display);font-size:clamp(1.5rem,3.5vw,2.1rem);line-height:1.3;margin-top:10px}
.sec{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid var(--ink);padding-bottom:8px;margin:38px 0 0;gap:12px}
.sec h2{font-size:1.5rem}.sec span{color:var(--muted);font-size:.9rem}
.crumb{background:none;border:0;padding:0;color:var(--muted);font-weight:600;margin-bottom:16px}
.crumb:hover{color:var(--ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.u{background:linear-gradient(transparent 62%,var(--mark) 62% 92%,transparent 92%);background-size:0 100%;background-repeat:no-repeat;animation:hl 1s .5s forwards}
@keyframes hl{to{background-size:100% 100%}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* landing */
.lnav{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px;border-bottom:1px solid var(--rule)}
.llinks{display:flex;gap:26px}.llinks .btn-link{color:var(--ink);text-decoration:none}.llinks .btn-link:hover{text-decoration:underline}
.lcta{display:flex;gap:10px;align-items:center}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;padding:64px 22px 56px}
.hero h1{font-size:clamp(2.6rem,6.5vw,4.6rem);line-height:1;font-weight:400}
.hero .lead{color:var(--muted);font-size:1.12rem;margin:20px 0 28px;max-width:40ch}
.sheet{background:var(--sheet);border:1.5px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:24px 26px 26px;border-radius:3px;transform:rotate(1.2deg)}
.sheet .sh-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:1.4rem}
.sheet .sh-l{font-family:var(--display);font-size:1.5rem;margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tickdraw{display:inline-grid;place-items:center;width:30px;height:30px;color:var(--biro);flex:none}
.tickdraw svg{width:100%;height:100%}.tickdraw path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s 1.8s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sample{width:100%;border-collapse:collapse;margin-top:14px;font-size:.95rem}
.sample td{padding:8px 4px;border-bottom:1px solid var(--rule);opacity:0;animation:rise .5s forwards}
.sample tr:nth-child(1) td{animation-delay:.3s}.sample tr:nth-child(2) td{animation-delay:.6s}.sample tr:nth-child(3) td{animation-delay:.9s}.sample tr.tot td{animation-delay:1.3s}
.sample tr.tot td{border-bottom:0;border-top:1.5px solid var(--ink);font-weight:600}
.sample td:last-child{text-align:right;font-family:var(--mono)}.sample td.pb{color:var(--muted)}
.lsec{padding:52px 22px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;margin-top:22px}
.f3 h3{font-size:1.4rem;margin-bottom:6px}.f3 p{color:var(--muted)}
.steps{list-style:none;margin:22px 0 0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:56px 1fr;gap:6px;padding:18px 0;border-bottom:1px solid var(--rule);counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--biro)}
.steps h3{font-size:1.3rem}.steps p{color:var(--muted);grid-column:2}
details.faq{border-bottom:1px solid var(--rule);padding:16px 0}
details.faq summary{font-family:var(--display);font-size:1.25rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::after{content:"+";font-family:var(--mono)}details.faq[open] summary::after{content:"–"}
details.faq p{color:var(--muted);margin-top:8px;max-width:62ch}
.lfoot{border-top:1.5px solid var(--ink);padding:28px 22px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:.9rem}

/* auth */
.auth{padding:56px 0 40px}
.auth-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:64px;align-items:start}
.auth-left .brand{font-size:2rem;display:block;margin-bottom:34px}
.auth-left h1{font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.04;font-weight:400}
.auth-left .lead{color:var(--muted);margin-top:18px;max-width:42ch;font-size:1.05rem}
.auth-right{background:var(--sheet);border:1.5px solid var(--ink);padding:30px 30px 34px;border-radius:3px;box-shadow:6px 6px 0 var(--ink)}
.auth-right h2{font-size:1.9rem}
.mode{display:flex;gap:20px;margin:16px 0 4px;border-bottom:1px solid var(--rule)}
.mode button{background:none;border:0;padding:6px 0 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.mode button[aria-pressed="true"]{color:var(--ink);border-color:var(--biro)}
.or{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:.85rem;margin:20px 0 0}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--rule)}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);background:var(--sheet);margin-top:24px}
.tile{padding:18px 20px;border-right:1px solid var(--rule)}.tile:last-child{border-right:0}
.tile .k{font-size:.82rem;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.tile .k svg{width:16px;height:16px}
.tile .v{font-family:var(--mono);font-size:1.7rem;font-weight:500;margin-top:6px;display:block;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:.85rem}
.tile .v.multi{font-size:1.25rem;margin-top:2px}.cc{font-style:normal;font-size:.7rem;color:var(--muted);margin-left:8px;font-family:var(--body)}
.chipfn{font-family:var(--mono);font-size:.75rem;border:1px solid var(--muted);padding:0 6px;border-radius:2px;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:38px}
.chart svg{width:100%;height:auto;display:block;margin-top:14px;color:var(--ink)}
.ct{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.qa{margin-top:4px}
.qa button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border:0;border-bottom:1px solid var(--rule);background:none;font-weight:600;text-align:left}
.qa button:hover{background:var(--sheet)}
.qa svg{width:20px;height:20px;color:var(--biro);flex:none}.qa .go{margin-left:auto;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;margin-top:18px}
.gc{background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden;transition:transform .15s,box-shadow .15s}
.gc:hover{box-shadow:5px 5px 0 var(--ink);transform:translate(-2px,-2px)}
.cov{display:block;aspect-ratio:2/1;border-bottom:1.5px solid var(--ink);overflow:hidden;background:var(--wash)}
.cov svg,.cov img{width:100%;height:100%;object-fit:cover;display:block}
.gb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
.gt{font-family:var(--display);font-size:1.45rem;line-height:1.2}
.gm{color:var(--muted);font-size:.88rem}
.gf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.gf .st{text-align:right;font-size:.85rem;color:var(--muted)}.gf .st .amt{display:block;font-size:1rem}
.gnew{border-style:dashed;align-items:center;justify-content:center;min-height:250px;color:var(--biro);font-weight:600;gap:8px;background:transparent}
.gnew:hover{box-shadow:none;transform:none;background:var(--sheet)}
.gnew svg{width:30px;height:30px}

/* group */
.banner{height:150px;border:1.5px solid var(--ink);overflow:hidden;position:relative;margin-bottom:20px;background:var(--wash)}
.banner svg,.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner .btn{position:absolute;right:10px;bottom:10px;background:var(--sheet);font-size:.85rem;padding:6px 11px}
.ghead{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-end}
.ghead h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:400;line-height:1.1}
.ghead .meta{color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.85rem}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--biro)}
.sync.blink::before{animation:blink .9s 2}
@keyframes blink{50%{opacity:.1}}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:44px;margin-top:26px;align-items:start}
.ledger{overflow-x:auto}
table.lt{width:100%;border-collapse:collapse;font-size:.95rem}
.lt th{text-align:left;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1.5px solid var(--ink);padding:0 8px 8px}
.lt th.r{text-align:right}
.lt td{padding:12px 8px;border-bottom:1px solid var(--rule);vertical-align:baseline}
.lt td.d{color:var(--muted);white-space:nowrap;font-family:var(--mono);font-size:.82rem;width:64px}
.lt .rowbtn{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:1rem}
.lt .rowbtn:hover{text-decoration:underline;text-decoration-color:var(--biro);text-underline-offset:4px}
.lt .rowbtn::before{content:"+";display:inline-block;width:1.1em;color:var(--muted);font-family:var(--mono);font-weight:400}
.lt .rowbtn[aria-expanded="true"]::before{content:"–"}
.lt .pb{display:none;color:var(--muted);font-weight:400;font-size:.85rem}
.lt tr.pay-row td{font-style:italic;color:var(--muted)}
.lt tr.detail td{background:var(--sheet);color:var(--muted);font-size:.9rem;padding:10px 8px 12px 34px}
.lt tr.detail b{color:var(--ink);font-weight:500}
.lt tfoot td{border-bottom:0;border-top:1.5px solid var(--ink);padding-top:12px;font-weight:600}
.lt tr.fresh td{background:var(--mark);animation:fadehl 3s ease-out forwards}
@keyframes fadehl{0%,40%{background:var(--mark)}100%{background:transparent}}
.rcpt{background:none;border:1.5px solid var(--muted);border-radius:2px;padding:1px 4px;margin-left:8px;color:var(--muted);vertical-align:-3px;display:inline-grid;place-items:center}
.rcpt:hover{color:var(--biro);border-color:var(--biro)}.rcpt svg{width:14px;height:14px}
.dact{display:flex;gap:18px;margin-top:8px;align-items:center;flex-wrap:wrap}
.empty{border:1.5px dashed var(--muted);padding:34px 22px;text-align:center;border-radius:3px}
.empty h3{font-size:1.5rem;margin-bottom:6px}.empty p{color:var(--muted);margin-bottom:16px}
.margin h3{font-size:1.3rem;border-bottom:1.5px solid var(--ink);padding-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.margin h3 small{font-family:var(--mono);font-size:.72rem;color:var(--muted);font-weight:400}
.margin section+section{margin-top:34px}
.bal,.payl,.hist{list-style:none;margin:0;padding:0}
.bal li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--rule)}
.bal .lead{flex:1;border-bottom:2px dotted var(--rule);transform:translateY(2px)}
.pay{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);position:relative}
.pay.mine::after{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:var(--biro)}
.pay .what{flex:1;line-height:1.3}
.struck .what,.struck .amt,.struck .fig-big{background:linear-gradient(var(--ink),var(--ink)) no-repeat 0 55%/0 2px;animation:strike .6s forwards;color:var(--muted)}
@keyframes strike{to{background-size:100% 2px}}
.tick{width:24px;height:24px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:2px;display:grid;place-items:center;flex:none;padding:0;color:transparent}
.tick:hover{color:var(--biro);border-color:var(--biro)}
.pay.struck .tick{color:var(--biro);border-color:var(--biro)}
.tick svg{width:16px;height:16px}
.hist{font-size:.92rem}.hist li{padding:9px 0;border-bottom:1px solid var(--rule)}.hist small{display:block;color:var(--muted)}
.done{padding:20px 0 6px;font-family:var(--display);font-size:1.5rem;display:flex;gap:12px;align-items:center}
.done .tickdraw{width:34px;height:34px}.done .tickdraw path{animation-delay:.1s}

/* settle screen */
.bigpay{border:1.5px solid var(--ink);background:var(--sheet);padding:30px 22px;display:grid;gap:22px;justify-items:center;text-align:center;margin-top:18px;border-radius:3px}
.who2{display:flex;align-items:center;gap:22px;justify-content:center;width:100%}
.pp{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600}
.arrow-l{flex:0 1 120px;min-width:40px;height:2px;background:repeating-linear-gradient(90deg,var(--ink) 0 8px,transparent 8px 14px);position:relative}
.arrow-l::after{content:"";position:absolute;right:-2px;top:-5px;border:6px solid transparent;border-left:10px solid var(--ink);border-right:0}
.payfig small{display:block;color:var(--muted)}
.fig-big{font-family:var(--mono);font-size:clamp(2.2rem,8vw,3.4rem);font-weight:500;border-bottom:4px double currentColor;display:inline-block;line-height:1.1;font-variant-numeric:tabular-nums}
.bigpay.out .fig-big{color:var(--red)}
.brk{margin-top:26px}
.brk li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--rule)}
.brk .grow{flex:1}

/* activity */
.ftabs{display:flex;gap:24px;border-bottom:1.5px solid var(--ink);margin-top:20px;overflow-x:auto}
.ftabs button{background:none;border:0;padding:10px 0;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.ftabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--biro)}
.tl{list-style:none;margin:18px 0 0;padding:0 0 0 24px;border-left:2px solid var(--ink)}
.tl li{position:relative;padding:14px 0 14px 4px;display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--rule)}
.tl li::before{content:"";position:absolute;left:-31px;top:21px;width:12px;height:12px;background:var(--paper);border:2px solid var(--ink)}
.tl li.k-payment::before{background:var(--biro);border-color:var(--biro)}.tl li.k-expense::before{background:var(--ink)}
.tl .tx{flex:1;min-width:0}.tl small{color:var(--muted);display:block}

/* settings */
.srow2{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.srow2 .l b{display:block;font-weight:600}.srow2 .l span{color:var(--muted);font-size:.9rem}
.prof{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:20px 0;border-bottom:1px solid var(--rule)}
.srow2 input[type=checkbox]{width:22px;height:22px;accent-color:var(--biro)}

/* modal + notes */
.scrim{position:fixed;inset:0;background:rgba(15,15,14,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--sheet);color:var(--ink);border:1.5px solid var(--ink);border-radius:3px;box-shadow:8px 8px 0 var(--ink);padding:28px;width:min(500px,100%);max-height:92%;overflow:auto;animation:rise .25s}
.modal h3{font-size:1.8rem}.modal .sub{color:var(--muted);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.mact{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;align-items:center}
.lblrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px;border-bottom:1.5px solid var(--ink);padding-bottom:4px}
.lblrow span{font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.toggle{display:flex;gap:14px}.toggle button{background:none;border:0;padding:0;font-size:.9rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.toggle button[aria-pressed="true"]{color:var(--ink);border-color:var(--biro)}
.srow{display:flex;align-items:center;gap:12px;margin:0;padding:9px 2px;border-bottom:1px solid var(--rule);font-size:1rem;color:var(--ink);font-weight:500;letter-spacing:0;cursor:pointer}
.srow input[type=checkbox]{width:18px;height:18px;accent-color:var(--biro);margin:0}
.srow .nm{flex:1}.srow.off .nm,.srow.off .amt{color:var(--muted);text-decoration:line-through}
.linkrow{display:flex;gap:12px;align-items:flex-end}
.pend{list-style:none;margin:12px 0 0;padding:0}
.pend li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule);font-size:.95rem}.pend small{color:var(--muted)}
.rcrow{display:flex;gap:16px;align-items:center;margin-top:10px}
.rcrow img{width:72px;height:72px;object-fit:cover;border:1.5px solid var(--ink);border-radius:2px}
.rcview img{max-width:100%;max-height:60vh;border:1.5px solid var(--ink);display:block;margin:14px auto 0}
.res,.pick{list-style:none;margin:10px 0 0;padding:0}
.resb{display:flex;justify-content:space-between;align-items:baseline;width:100%;gap:12px;padding:11px 8px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;color:var(--ink)}
.resb small{color:var(--muted)}.resb[aria-selected="true"],.resb:hover{background:var(--wash)}
.covpick{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
.covpick button.cv{width:78px;height:44px;border:2px solid var(--rule);padding:0;overflow:hidden;background:none;border-radius:2px}
.covpick button.cv[aria-pressed="true"]{border-color:var(--biro);outline:2px solid var(--biro);outline-offset:1px}
.covpick svg,.covpick img{width:100%;height:100%;display:block;object-fit:cover}
#notes{position:fixed;top:70px;right:16px;display:flex;flex-direction:column;gap:10px;z-index:60;width:min(340px,calc(100% - 32px))}
.note{background:var(--sheet);color:var(--ink);border:1.5px solid var(--ink);border-left:5px solid var(--biro);border-radius:3px;padding:11px 14px;font-size:.95rem;animation:rise .3s;box-shadow:4px 4px 0 var(--ink)}
.note.out{opacity:0;transition:opacity .3s}

/* prototype bar */
.proto{position:fixed;left:12px;bottom:12px;background:var(--ink);color:var(--paper);display:flex;gap:2px;padding:4px;border-radius:3px;z-index:40;max-width:calc(100% - 24px);overflow-x:auto;font-size:.88rem}
.proto button{background:none;border:0;color:inherit;padding:7px 12px;border-radius:2px;font-weight:600;white-space:nowrap}
.proto button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.proto button:hover:not([aria-pressed="true"]){background:rgba(128,128,128,.35)}
.proto .sep{width:1px;background:currentColor;opacity:.3;margin:5px 4px}

/* data model */
.model h1{font-size:clamp(2rem,5vw,3rem);font-weight:400}
.model .lead{color:var(--muted);max-width:64ch;margin-top:8px}
.erd-scroll{overflow-x:auto;background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;margin-top:22px}
.erd{position:relative;width:1070px;height:700px;margin:0 auto}
.erd-svg{position:absolute;inset:0;pointer-events:none}
.erd-svg path{fill:none;stroke:var(--muted);stroke-width:1.3;opacity:.75;transition:opacity .2s}
.erd-svg.dim path{opacity:.1}.erd-svg.dim path.on{opacity:1;stroke:var(--biro);stroke-width:2.2}
.erd-svg circle.many{fill:var(--muted)}.erd-svg circle.one{fill:var(--sheet);stroke:var(--muted);stroke-width:1.5}
.tbl{position:absolute;width:236px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;font-size:.82rem;z-index:2}
.tbl.stretch{border-style:dashed}
.tbl h4{margin:0;background:var(--ink);color:var(--paper);font-family:var(--mono);font-weight:500;font-size:.86rem;padding:7px 12px;display:flex;justify-content:space-between;gap:6px}
.tbl h4 small{font-family:var(--body);font-size:.68rem;background:var(--mark);color:#1b1b1a;padding:1px 7px;border-radius:2px;align-self:center;font-weight:700}
.tbl .c{display:flex;gap:6px;padding:4px 12px;height:26px;align-items:center;border-top:1px solid var(--rule);font-family:var(--mono)}
.tbl .c .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tbl .c .ty{color:var(--muted);font-size:.74rem}
.tbl .c .k{font-size:.62rem;font-weight:700;padding:0 5px;border:1px solid var(--muted);color:var(--muted);font-family:var(--body);border-radius:2px}
.tbl .c .k.pk{background:var(--biro);border-color:var(--biro);color:var(--biro-ink)}
.legend{display:flex;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:.88rem;margin-top:12px}
table.rls{width:100%;border-collapse:collapse;font-size:.93rem;margin-top:8px}
.rls th,.rls td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.rls th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1.5px solid var(--ink)}
.rls td:first-child{font-family:var(--mono);white-space:nowrap}
.tblwrap{overflow-x:auto}
.callout{border-left:5px solid var(--biro);background:var(--sheet);padding:14px 18px;margin-top:16px}
pre.log{font-family:var(--mono);font-size:.82rem;overflow-x:auto;background:var(--wash);padding:14px;margin:10px 0 0;line-height:1.75;white-space:pre}
code{font-family:var(--mono);font-size:.88em;background:var(--wash);padding:1px 6px;border-radius:2px}
.denied .line{max-width:52ch}

/* phone / narrow layout: driven by the width of the app, so the phone preview and real phones match */
@container shell (max-width:860px){
  .shell{grid-template-columns:1fr}.side{display:none}.main{padding:0 18px 30px}.mbrand{display:block;font-size:1.4rem}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:sticky;bottom:0;background:var(--sheet);border-top:1.5px solid var(--ink);z-index:25}
  .tabi{flex-direction:column;gap:2px;padding:9px 4px 8px;border-left:0;border-top:3px solid transparent;font-size:.72rem;text-align:center;justify-content:center}
  .tabi[aria-current="page"]{color:var(--biro);border-top-color:var(--biro)}
  .searchbtn{flex:none;max-width:none;padding:9px;margin-left:auto}.searchbtn .stxt,.searchbtn kbd{display:none}
  .theme span{display:none}.theme{padding:8px}
  .tiles{grid-template-columns:1fr}.tile{border-right:0;border-bottom:1px solid var(--rule)}.tile:last-child{border-bottom:0}
  .dgrid{grid-template-columns:1fr;gap:6px}
  .cols{grid-template-columns:1fr;gap:34px}.margin{order:-1}
  .hero{grid-template-columns:1fr;gap:34px;padding:34px 18px}.sheet{transform:none}
  .f3{grid-template-columns:1fr;gap:22px}.llinks{display:none}.lnav .btn:not(.btn-primary){display:none}
  .auth-grid{grid-template-columns:1fr;gap:34px}.auth{padding-top:26px}
  .lt th.pbh,.lt td.pbc{display:none}.lt .pb{display:block}
  .banner{height:110px}.bigpay{padding:24px 14px}.who2{gap:10px}
  .wrap{padding:0 18px}.lsec{padding:36px 18px}
}
@media (max-width:540px){.row2{grid-template-columns:1fr}}
@media (max-width:860px){.proto{bottom:76px}}
#shell.phone .row2{grid-template-columns:1fr}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}.u{background-size:100% 100%}.sample td{opacity:1}.tickdraw path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="shell">
  <div id="scroll"><div id="app"></div></div>
  <div id="modal-root"></div>
</div>
<div id="notes" aria-live="polite"></div>
<nav class="proto" aria-label="Prototype controls">
  <button data-act="proto-app" id="pApp" aria-pressed="true">App</button>
  <button data-act="proto-model" id="pModel" aria-pressed="false">Data model</button>
  <span class="sep"></span>
  <button data-act="phone" id="pPhone" aria-pressed="false">Phone view</button>
  <button data-act="simulate">Simulate live update</button>
  <button data-act="proto-denied">Test: group I'm not in</button>
</nav>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U={dami:'Dami',ada:'Ada',femi:'Femi',zainab:'Zainab',chidi:'Chidi',tolu:'Tolu'};
const ME='dami';
const nm=id=>id===ME?'You':U[id];
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON={
  dash:svg('<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>'),
  groups:svg('<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c3 .2 5 2.3 5 5.8"/>'),
  activity:svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/>'),
  settings:svg('<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>'),
  search:svg('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>'),
  plus:svg('<path d="M12 5v14M5 12h14"/>'),
  invite:svg('<circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c0-3.6 2.9-6 6.5-6"/><path d="M18 14v6M15 17h6"/>'),
  settle:svg('<path d="M4 12.5l5 5L20 6.5"/>'),
  down:svg('<path d="M12 5v14M6 13l6 6 6-6"/>'),
  up:svg('<path d="M12 19V5M6 11l6-6 6 6"/>'),
  net:svg('<path d="M4 8h16M4 16h16M9 4l-4 4 4 4M15 12l4 4-4 4"/>'),
  go:svg('<path d="M9 5l7 7-7 7"/>'),
  photo:svg('<path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/>')
};
const TICK=svg('<path d="M4 12.5l5 5L20 6.5"/>');

/* illustrated people (stand-ins for profile photos) */
const AVD={
  dami:{bg:'#FFEE9A',skin:'#7A4B32',hair:'short',hc:'#1B1B1A',top:'#1E3FB8'},
  ada:{bg:'#B9C6FF',skin:'#9A6340',hair:'afro',hc:'#1B1B1A',top:'#B8231D'},
  femi:{bg:'#F4B6A8',skin:'#6B4430',hair:'short',hc:'#1B1B1A',top:'#1B1B1A'},
  zainab:{bg:'#FFEE9A',skin:'#A8734D',hair:'scarf',hc:'#1E3FB8',top:'#EFE3B5'},
  chidi:{bg:'#CFE3D0',skin:'#8A5A3C',hair:'short',hc:'#1B1B1A',top:'#1E3FB8'},
  tolu:{bg:'#B9C6FF',skin:'#B07A52',hair:'afro',hc:'#1B1B1A',top:'#1B1B1A'}
};
const PHOTO={};
function avSvg(id){
  const a=AVD[id]||AVD.dami;
  const back=a.hair==='afro'?`<circle cx="20" cy="15" r="11.5" fill="${a.hc}"/>`:'';
  const front=a.hair==='short'?`<path d="M12.6 15c0-6 3.2-9 7.4-9s7.4 3 7.4 9c-2-3-4.7-4-7.4-4s-5.400 1-7.400 4z" fill="${a.hc}"/>`:a.hair==='scarf'?`<path d="M11.5 15c0-7 3.8-10.500 8.500-10.500S28.500 8 28.500 15c-3-3.200-5.500-4.200-8.500-4.200S14.500 11.800 11.500 15z" fill="${a.hc}"/><circle cx="27" cy="13" r="3" fill="${a.hc}"/>`:'';
  return `<svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" fill="${a.bg}"/>${back}<path d="M4 41c1-9.500 7-13.500 16-13.500S35 31.500 36 41z" fill="${a.top}"/><rect x="17" y="21" width="6" height="8" fill="${a.skin}"/><ellipse cx="20" cy="16.500" rx="7" ry="8" fill="${a.skin}"/>${front}</svg>`;
}
const av=(id,size='')=>`<span class="av ${size}" title="${esc(U[id])}">${PHOTO[id]?`<img src="${PHOTO[id]}" alt="${esc(U[id])}">`:avSvg(id)}</span>`;
const avs=(ids,size='sm')=>`<span class="avs">${ids.map(i=>av(i,size)).join('')}</span>`;

/* illustrated group covers (stand-ins for photos) */
const COVERS={
 beach:`<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="200" fill="#DCE3FF"/><circle cx="300" cy="62" r="34" fill="#FFEE9A" stroke="#1B1B1A" stroke-width="3"/><rect y="118" width="400" height="44" fill="#1E3FB8"/><path d="M0 132q25-10 50 0t50 0 50 0 50 0 50 0 50 0 50 0 50 0M0 148q25-10 50 0t50 0 50 0 50 0 50 0 50 0 50 0 50 0" fill="none" stroke="#DCE3FF" stroke-width="3"/><rect y="160" width="400" height="40" fill="#EFE3B5"/><path d="M0 160h400" stroke="#1B1B1A" stroke-width="3"/><g stroke="#1B1B1A" stroke-width="5" fill="none" stroke-linecap="round"><path d="M96 192c4-30 6-60 22-94"/><path d="M118 98c-16-14-34-14-48-4M118 98c10-18 28-24 44-18M118 98c20-6 36 2 44 14M118 98c-10 10-14 22-12 36"/><path d="M330 194c2-20 0-44-10-68"/><path d="M320 126c-12-10-26-10-36-2M320 126c8-14 22-18 34-12M320 126c14-2 26 6 30 16"/></g></svg>`,
 flat:`<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><pattern id="wy" width="24" height="26" patternUnits="userSpaceOnUse"><rect x="7" y="8" width="11" height="12" fill="#FFEE9A"/></pattern><pattern id="wk" width="24" height="26" patternUnits="userSpaceOnUse"><rect x="7" y="8" width="11" height="12" fill="#1B1B1A"/></pattern></defs><rect width="400" height="200" fill="#FFEE9A"/><circle cx="350" cy="36" r="20" fill="#F5F5F1" stroke="#1B1B1A" stroke-width="3"/><g stroke="#1B1B1A" stroke-width="3"><rect x="30" y="76" width="72" height="124" fill="#1E3FB8"/><rect x="110" y="40" width="82" height="160" fill="#F5F5F1"/><rect x="200" y="92" width="62" height="108" fill="#1B1B1A"/><rect x="270" y="58" width="92" height="142" fill="#1E3FB8"/></g><rect x="30" y="76" width="72" height="124" fill="url(#wy)"/><rect x="110" y="40" width="82" height="160" fill="url(#wk)"/><rect x="200" y="92" width="62" height="108" fill="url(#wy)"/><rect x="270" y="58" width="92" height="142" fill="url(#wy)"/><path d="M0 198h400" stroke="#1B1B1A" stroke-width="4"/></svg>`,
 dinner:`<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="200" fill="#1E3FB8"/><circle cx="200" cy="100" r="82" fill="#F5F5F1" stroke="#1B1B1A" stroke-width="3"/><g stroke="#1B1B1A" stroke-width="3"><circle cx="200" cy="48" r="17" fill="#FFEE9A"/><circle cx="200" cy="152" r="17" fill="#FFEE9A"/><circle cx="148" cy="100" r="17" fill="#FFEE9A"/><circle cx="252" cy="100" r="17" fill="#FFEE9A"/><circle cx="200" cy="100" r="15" fill="#B8231D"/><circle cx="176" cy="72" r="6" fill="#DCE3FF"/><circle cx="224" cy="72" r="6" fill="#DCE3FF"/><circle cx="176" cy="128" r="6" fill="#DCE3FF"/><circle cx="224" cy="128" r="6" fill="#DCE3FF"/></g><g fill="#F5F5F1" stroke="#1B1B1A" stroke-width="2"><circle cx="200" cy="48" r="7"/><circle cx="200" cy="152" r="7"/><circle cx="148" cy="100" r="7"/><circle cx="252" cy="100" r="7"/></g></svg>`,
 trip:`<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="200" fill="#DCE3FF"/><circle cx="70" cy="150" r="70" fill="#FFEE9A" opacity=".8"/><path d="M52 150Q190 -10 340 118" fill="none" stroke="#1B1B1A" stroke-width="4" stroke-dasharray="4 10" stroke-linecap="round"/><circle cx="52" cy="150" r="12" fill="#1E3FB8" stroke="#1B1B1A" stroke-width="3"/><path d="M340 118c-14-18-24-30-24-44a24 24 0 0 1 48 0c0 14-10 26-24 44z" fill="#B8231D" stroke="#1B1B1A" stroke-width="3"/><circle cx="340" cy="74" r="8" fill="#F5F5F1"/></svg>`,
 plain:`<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="200" fill="#F5F5F1"/><g stroke="#1B1B1A" stroke-width="1.5" opacity=".7"><path d="M0 30h400M0 60h400M0 90h400M0 120h400M0 150h400M0 180h400"/></g><path d="M56 0v200" stroke="#B8231D" stroke-width="2.5"/><path d="M92 74l16 16 40-48" fill="none" stroke="#1E3FB8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`
};
const cover=g=>g.photo?`<img src="${g.photo}" alt="">`:COVERS[g.cover||'plain'];
const PHOTO_ICON=ICON.photo;

/* money: integers in the currency's smallest unit (kobo, cents, pence). Never floats. */
const CUR={
 NGN:{sym:'₦',name:'Nigerian naira',exp:2,minor:'kobo'},USD:{sym:'$',name:'US dollar',exp:2,minor:'cent'},GBP:{sym:'£',name:'British pound',exp:2,minor:'penny'},
 EUR:{sym:'€',name:'Euro',exp:2,minor:'cent'},GHS:{sym:'GH₵',name:'Ghanaian cedi',exp:2,minor:'pesewa'},KES:{sym:'KSh ',name:'Kenyan shilling',exp:2,minor:'cent'},
 ZAR:{sym:'R',name:'South African rand',exp:2,minor:'cent'},CAD:{sym:'CA$',name:'Canadian dollar',exp:2,minor:'cent'},JPY:{sym:'¥',name:'Japanese yen',exp:0,minor:'yen'}
};
let CC='NGN';
const pw=c=>Math.pow(10,CUR[c].exp);
const fmt=(k,c=CC)=>{const neg=k<0;k=Math.abs(k);const p=pw(c),w=Math.floor(k/p),r=k%p,e=CUR[c].exp;return(neg?'-':'')+CUR[c].sym+w.toLocaleString('en-NG')+(r?'.'+String(r).padStart(e,'0'):'')};
const sgn=(n,c=CC)=>n>0?`<span class="amt pos">+${fmt(n,c)}</span>`:n<0?`<span class="amt neg">(${fmt(-n,c)})</span>`:`<span class="amt" style="color:var(--muted)">—</span>`;
const toIn=(k,c=CC)=>{const p=pw(c),e=CUR[c].exp,r=k%p;return Math.floor(k/p)+(r?'.'+String(r).padStart(e,'0'):'')};
const parseK=(s,c=CC)=>{const e=CUR[c].exp;s=String(s).replace(/[,\s]/g,'').replace(CUR[c].sym.trim(),'');if(!new RegExp('^\\d*\\.?\\d{0,'+e+'}$').test(s)||s===''||s==='.')return null;const[w,f='']=s.split('.');return parseInt(w||'0',10)*pw(c)+(e?parseInt((f+'0'.repeat(e)).slice(0,e),10):0)};
const eq=(total,ids)=>{const n=ids.length,b=Math.floor(total/n),r=total%n,o={};ids.forEach((id,i)=>o[id]=b+(i<r?1:0));return o};

/* In the real build, settle-up runs in a Firebase Cloud Function (callable) */
function balances(g){
  const net={};g.members.forEach(m=>net[m]=0);
  g.expenses.forEach(e=>{net[e.paidBy]+=e.amount;for(const[u,a]of Object.entries(e.splits))net[u]-=a});
  g.payments.forEach(p=>{net[p.from]+=p.amount;net[p.to]-=p.amount});
  return net;
}
function settle(net){
  const cr=[],db=[];
  Object.entries(net).forEach(([u,n])=>{if(n>0)cr.push({u,n});else if(n<0)db.push({u,n:-n})});
  const out=[];
  while(cr.length&&db.length){
    cr.sort((a,b)=>b.n-a.n);db.sort((a,b)=>b.n-a.n);
    const c=cr[0],d=db[0],a=Math.min(c.n,d.n);
    out.push({from:d.u,to:c.u,amount:a});c.n-=a;d.n-=a;
    if(!c.n)cr.shift();if(!d.n)db.shift();
  }
  return out;
}

  const L=62,R=8,T=24,B=30,W=560,H=230,pwid=(W-L-R)/6,bw=Math.min(40,pwid*.6),ph=H-T-B;
  let g='';
  [0,.5,1].forEach(f=>{const y=T+ph*(1-f);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--rule)" ${f?'stroke-dasharray="3 4"':'stroke="var(--ink)"'}/><text x="${L-8}" y="${y+4}" text-anchor="end" class="ct">${f?CUR[c].sym.trim()+kf(top*f/pw(c)):'0'}</text>`});
  M.forEach((o,i)=>{const h=ph*o.v/top,x=L+pwid*i+(pwid-bw)/2,y=T+ph-h,cu=i===5;
    g+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${cu?'var(--biro)':'url(#hatch)'}" stroke="${cu?'var(--biro)':'currentColor'}" stroke-width="1.5"/><text x="${x+bw/2}" y="${H-10}" text-anchor="middle" class="ct" ${cu?'style="fill:var(--ink);font-weight:500"':''}>${o.l}</text>${cu?`<text x="${x+bw/2}" y="${y-7}" text-anchor="middle" class="ct" style="fill:var(--ink);font-weight:500">${fmt(o.v,c)}</text>`:''}`});
  const label='Your share of spending by month, in '+c+': '+M.map(o=>`${o.l} ${fmt(o.v,c)}`).join(', ')+'.';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--sheet)"/><line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width="2"/></pattern></defs>${g}</svg>`;
}

/* group */
function groupView(){
  const g=cur(),bal=balances(g),plan=settle(bal),n=bal[ME]||0,total=g.expenses.reduce((a,e)=>a+e.amount,0);
  let line;
  if(n>0)line=`You're owed <span class="fig">${fmt(n)}</span>.`;
  else if(n<0){const m=plan.filter(p=>p.from===ME);line=m.length===1?`You owe ${U[m[0].to]} <span class="fig neg">${fmt(m[0].amount)}</span>.`:`You owe <span class="fig neg">${fmt(-n)}</span> in total.`}
  else line=`You're all square here.`;
  const others=g.members.filter(m=>m!==ME).map(nm);
  const rows=[...g.expenses.map(e=>({k:'e',t:e.t,e})),...g.payments.map(p=>({k:'p',t:p.t,p}))].sort((a,b)=>b.t-a.t);
  const tbody=rows.map(r=>{
    if(r.k==='p'){const p=r.p,d=p.from===ME?p.amount:p.to===ME?-p.amount:0;
      return `<tr class="pay-row ${S.flash===p.id?'fresh':''}"><td class="d">${dshort(p.t)}</td><td>Payment: ${nm(p.from)} → ${nm(p.to)}</td><td class="pbc">${nm(p.from)}</td><td class="r"><span class="amt">${fmt(p.amount)}</span></td><td class="r">${sgn(d)}</td></tr>`}
    const e=r.e,d=(e.paidBy===ME?e.amount:0)-(e.splits[ME]||0),open=S.open.has(e.id),cnt=Object.keys(e.splits).length;
    return `<tr class="${S.flash===e.id?'fresh':''}"><td class="d">${dshort(e.t)}</td><td><button class="rowbtn" data-act="toggle" data-id="${e.id}" aria-expanded="${open}">${esc(e.title)}</button>${e.receipt?`<button class="rcpt" data-act="view-receipt" data-id="${e.id}" aria-label="View receipt for ${esc(e.title)}">${PHOTO_ICON}</button>`:''}<span class="pb"> Paid by ${nm(e.paidBy)}</span></td><td class="pbc"><span class="who">${av(e.paidBy,'sm')}${nm(e.paidBy)}</span></td><td class="r"><span class="amt">${fmt(e.amount)}</span></td><td class="r">${sgn(d)}</td></tr>`
    +(open?`<tr class="detail"><td></td><td colspan="4">Split ${cnt} way${cnt>1?'s':''}: ${Object.entries(e.splits).map(([u,a])=>`<b>${nm(u)}</b> <span class="amt">${fmt(a)}</span>`).join(' · ')}<div class="dact">${e.createdBy===ME?`<button class="btn btn-link" data-act="edit-expense" data-id="${e.id}">Edit</button><button class="btn btn-link neg" data-act="delete-expense" data-id="${e.id}">Delete</button>`:`<span>Only ${U[e.createdBy]} can edit or delete this.</span>`}</div></td></tr>`:'');
  }).join('');
  const ledger=g.expenses.length||g.payments.length?`<div class="ledger"><table class="lt"><thead><tr><th>Date</th><th>What</th><th class="pbh">Paid by</th><th class="r">Amount</th><th class="r">You</th></tr></thead><tbody>${tbody}</tbody><tfoot><tr><td></td><td colspan="2">Total spent</td><td class="r"><span class="amt">${fmt(total)}</span></td><td></td></tr></tfoot></table></div>`
    :`<div class="empty"><h3>Nothing written down yet</h3><p>Add the first expense. Everyone in the group sees it the moment you save.</p><button class="btn btn-primary" data-act="add-expense">Add expense</button></div>`;
  const settleHtml=plan.length?`<ul class="payl">${plan.map(p=>`<li class="pay ${p.from===ME||p.to===ME?'mine':''}" data-key="${p.from}-${p.to}"><button class="tick" data-act="pay" data-from="${p.from}" data-to="${p.to}" data-amt="${p.amount}" aria-label="Mark ${nm(p.from)} paying ${nm(p.to)} as paid">${TICK}</button><span class="what"><b>${nm(p.from)}</b> ${p.from===ME?'pay':'pays'} <b>${nm(p.to)}</b></span><span class="amt">${fmt(p.amount)}</span></li>`).join('')}</ul><p class="tiny">${plan.length} payment${plan.length>1?'s':''} for ${g.members.length} people, worked out by the server. Tick a line once the money has moved. <button class="btn btn-link" data-act="open-settle">Open settle-up screen</button></p>`
    :`<p class="done"><span class="tickdraw">${TICK}</span>All square.</p>`;
  const hist=g.activity.slice().sort((a,b)=>b.t-a.t).slice(0,5);
  return shell(`<button class="crumb" data-act="nav" data-v="groups">← All groups</button>
   <div class="banner">${cover(g)}<button class="btn" data-act="cover-pick">Change cover</button><input type="file" id="coverFile" accept="image/*" hidden></div>
   <div class="ghead"><div><h1>${esc(g.name)}</h1><p class="meta">${avs(g.members,'')}<span>${others.length?others.join(', ')+' and you':'Just you so far'}</span><span class="chipfn" title="${CUR[g.currency].name}">${g.currency}</span><span class="sync" id="sync">Updates live</span></p></div>
    <div class="btns"><button class="btn" data-act="invite">Invite</button><button class="btn" data-act="open-settle">Settle up</button><button class="btn btn-primary" data-act="add-expense">Add expense</button></div></div>
   <p class="line">${line}</p>
   <div class="cols"><div>${ledger}</div>
    <aside class="margin"><section><h3>Where everyone stands</h3><ul class="bal">${g.members.map(m=>`<li>${av(m,'sm')}<span>${nm(m)}</span><span class="lead"></span>${sgn(bal[m])}</li>`).join('')}</ul><p class="tiny">Brackets mean they owe the group.</p></section>
    <section><h3>To clear everything <small>settle-up()</small></h3>${settleHtml}</section>
    <section><h3>Recent</h3><ul class="hist">${hist.map(a=>`<li>${actText(a)}<small>${ago(a.t)}</small></li>`).join('')}</ul></section></aside></div>`,'groups');
}

/* settle-up screen */

  const big=p=>{const out=p.from===ME;return `<div class="bigpay ${out?'out':''}" data-key="${p.from}-${p.to}"><div class="who2"><span class="pp">${av(p.from,'xl')}<span>${nm(p.from)}</span></span><span class="arrow-l"></span><span class="pp">${av(p.to,'xl')}<span>${nm(p.to)}</span></span></div>
    <div class="payfig"><small>${out?`You pay ${U[p.to]}`:p.to===ME?`${nm(p.from)} pays you`:''}</small><span class="fig-big">${fmt(p.amount)}</span></div>
    <button class="btn btn-primary btn-big" data-act="pay" data-from="${p.from}" data-to="${p.to}" data-amt="${p.amount}">${out?'Record payment':'Mark as received'}</button></div>`};
  const body=!plan.length?`<div class="bigpay"><span class="tickdraw" style="width:56px;height:56px">${TICK}</span><h2 style="font-size:2rem">All square.</h2><p style="color:var(--muted)">Nobody owes anybody in ${esc(g.name)}.</p></div>`

  const brk=S.breakdown?`<ul class="payl brk">${plan.map(p=>`<li>${av(p.from,'sm')}<span class="grow"><b>${nm(p.from)}</b> ${p.from===ME?'pay':'pays'} <b>${nm(p.to)}</b></span><span class="amt">${fmt(p.amount)}</span></li>`).join('')||'<li>No payments needed.</li>'}</ul>`:'';
  return shell(`<button class="crumb" data-act="open-group" data-id="${g.id}">← ${esc(g.name)}</button>
   <h1 class="greet">Settle up</h1><p class="line">The fewest payments that clear everyone's balance.</p>${body}
   <p style="text-align:center;margin-top:20px"><button class="btn btn-link" data-act="breakdown">${S.breakdown?'Hide full breakdown':'View full breakdown'} ${S.breakdown?'↑':'↓'}</button></p>${brk}`,'groups');
}

/* modals */
function openSearch(){
  modal(`<h3>Search</h3><input class="field" id="q" placeholder="Search groups and expenses" autocomplete="off" aria-label="Search groups and expenses" style="margin-top:12px"><ul class="res" id="res" role="listbox"></ul><p class="tiny">Up and down to move, Enter to open, Esc to close.</p><div class="mact"><button type="button" class="btn btn-link" data-act="close-modal">Close</button></div>`,m=>{
    let idx=0,items=[];
    const draw=()=>{$('#res').innerHTML=items.length?items.map((it,i)=>`<li><button class="resb" data-i="${i}" aria-selected="${i===idx}"><span>${esc(it.label)}</span><small>${esc(it.sub)}</small></button></li>`).join(''):'<li class="tiny" style="padding:14px 2px">Nothing matches that. Try a group name or an expense title.</li>'};
    const run=()=>{const q=$('#q').value.trim().toLowerCase();items=[];
      S.groups.forEach(g=>{if(!q||g.name.toLowerCase().includes(q))items.push({g,label:g.name,sub:'Group'})});
      if(q)S.groups.forEach(g=>g.expenses.forEach(e=>{if(e.title.toLowerCase().includes(q))items.push({g,e,label:e.title,sub:`${g.name} · ${fmt(e.amount,g.currency)}`})}));
      idx=0;draw()};
    const go=i=>{const it=items[i];if(!it)return;closeModal();S.gid=it.g.id;S.view='group';if(it.e){S.open.add(it.e.id);S.flash=it.e.id}render()};
    $('#q').addEventListener('input',run);
    $('#q').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){idx=Math.min(items.length-1,idx+1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){idx=Math.max(0,idx-1);draw();e.preventDefault()}else if(e.key==='Enter'){go(idx);e.preventDefault()}});
    $('#res').addEventListener('click',e=>{const b=e.target.closest('.resb');if(b)go(+b.dataset.i)});
    run();
  });
}

function openInvite(){
  const g=cur(),link='splitit.app/join/'+Math.random().toString(36).slice(2,10);

  modal(`<h3>Invite to ${esc(g.name)}</h3><p class="sub">Share a link, or send an invite by email.</p>
   <label for="invLink">Invite link</label><div class="linkrow"><input class="field" id="invLink" readonly value="${link}" style="font-family:var(--mono);font-size:.9rem"><button class="btn" id="copyBtn" type="button">Copy</button></div>
   <form id="invForm" novalidate><label for="invEmail">Or by email</label><div class="linkrow"><input class="field" id="invEmail" type="email" placeholder="friend@example.com" autocomplete="off"><button class="btn btn-primary">Send</button></div><p class="err" id="invErr" role="alert"></p></form>

}
function openExpense(editId){
  const g=cur();CC=g.currency;const old=editId?g.expenses.find(x=>x.id===editId):null;
  const sel=new Set(old?Object.keys(old.splits):g.members),custom={};let mode='equal',receipt=(old&&old.receipt)||null;
  const ks=k=>toIn(k);
  if(old){const ids=g.members.filter(x=>sel.has(x)),e0=eq(old.amount,ids);if(ids.some(x=>e0[x]!==old.splits[x])){mode='custom';ids.forEach(x=>custom[x]=ks(old.splits[x]))}}
  modal(`<h3>${old?'Edit expense':'Add an expense'}</h3><p class="sub">${old?'Balances update for everyone as soon as you save.':`Everyone in ${esc(g.name)} sees it right away.`}</p>
   <form id="exForm" novalidate><label for="exTitle">What was it for?</label><input class="field" id="exTitle" placeholder="Suya and drinks" autocomplete="off" value="${old?esc(old.title):''}">
   <div class="row2"><div><label for="exAmt">Amount</label><div class="money"><span>${CUR[CC].sym}</span><input id="exAmt" inputmode="decimal" placeholder="0.00" autocomplete="off" value="${old?ks(old.amount):''}"></div></div>
   <div><label for="exPaid">Paid by</label><select class="field" id="exPaid">${g.members.map(m=>`<option value="${m}" ${old&&old.paidBy===m?'selected':''}>${nm(m)}</option>`).join('')}</select></div></div>
   <div class="lblrow"><span>Split between</span><div class="toggle" role="group" aria-label="Split type"><button type="button" data-mode="equal" aria-pressed="${mode==='equal'}">Equally</button><button type="button" data-mode="custom" aria-pressed="${mode==='custom'}">Custom amounts</button></div></div>
   <div id="splitBox"></div>
   <div class="lblrow"><span>Receipt photo (optional)</span></div><div id="rcBox"></div><p class="err" id="rcErr" role="alert"></p>
   <p class="err" id="exErr" role="alert"></p>
   <div class="mact"><button type="button" class="btn btn-link" data-act="close-modal">Cancel</button><button class="btn btn-primary">${old?'Save changes':'Add expense'}</button></div></form>`,m=>{
    const box=$('#splitBox'),rc=$('#rcBox'),ids=()=>g.members.filter(x=>sel.has(x));
    const left=()=>{const amt=parseK($('#exAmt').value)||0,sum=ids().reduce((a,x)=>a+(parseK(custom[x]||'0')||0),0),l=amt-sum;$('#cuLeft').textContent=!amt?'Enter the amount first.':l===0?`Every ${CUR[CC].minor} is assigned.`:l>0?`${fmt(l)} left to assign.`:`${fmt(-l)} too much.`};
    const draw=()=>{
      const amt=parseK($('#exAmt').value)||0,list=ids(),sh=amt&&list.length?eq(amt,list):{};
      let h=g.members.map(x=>{const on=sel.has(x);
        return `<label class="srow ${on?'':'off'}" for="sp-${x}"><input type="checkbox" id="sp-${x}" data-m="${x}" ${on?'checked':''}>${av(x,'sm')}<span class="nm">${nm(x)}</span>${mode==='equal'?`<span class="amt">${on&&amt?fmt(sh[x]):'—'}</span>`:(on?`<span class="money sm"><span>${CUR[CC].sym}</span><input data-cu="${x}" inputmode="decimal" placeholder="0" value="${esc(custom[x]||'')}" aria-label="Amount for ${nm(x)}" autocomplete="off"></span>`:'<span class="amt">—</span>')}</label>`}).join('');
      h+=mode==='equal'?`<p class="hint">${amt&&list.length&&new Set(Object.values(sh)).size>1?`The odd ${CUR[CC].minor} goes to the first names so the total always matches.`:'Untick anyone who was not part of it.'}</p>`:'<p class="hint" id="cuLeft"></p>';
      box.innerHTML=h;if(mode==='custom')left();
    };
    const drawR=()=>{rc.innerHTML=receipt?`<div class="rcrow"><img src="${receipt}" alt="Receipt preview"><button type="button" class="btn btn-link" id="rcRemove">Remove photo</button></div>`:`<button type="button" class="btn" id="rcPick">Choose a photo</button><input type="file" id="rcFile" accept="image/*" hidden><p class="hint">Stored privately. Only group members can open it.</p>`};
    draw();drawR();$('#exAmt').addEventListener('input',draw);
    box.addEventListener('change',e=>{const x=e.target.dataset.m;if(!x)return;e.target.checked?sel.add(x):sel.delete(x);draw()});
    box.addEventListener('input',e=>{if(e.target.dataset.cu){custom[e.target.dataset.cu]=e.target.value;left()}});
    rc.addEventListener('click',e=>{if(e.target.id==='rcPick')$('#rcFile').click();if(e.target.id==='rcRemove'){receipt=null;drawR()}});
    rc.addEventListener('change',e=>{if(e.target.id!=='rcFile')return;const f=e.target.files[0];if(!f)return;const err=chkImg(f);if(err){$('#rcErr').textContent=err;return}
      $('#rcErr').textContent='';readImg(f,u=>{receipt=u;drawR()},()=>{$('#rcErr').textContent='Could not read that photo. Try another.'})});
    m.querySelector('.toggle').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.mode;m.querySelectorAll('.toggle button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
    $('#exForm').addEventListener('submit',e=>{
      e.preventDefault();const title=$('#exTitle').value.trim(),amt=parseK($('#exAmt').value),list=ids();let err='',splits;
      if(!title)err='Give it a short title, like “Dinner at Yellow Chilli”.';
      else if(!amt)err='Enter an amount above zero, with at most two decimals.';
      else if(!list.length)err='Tick at least one person to split with.';
      else if(mode==='equal')splits=eq(amt,list);
      else{splits={};let sum=0;list.forEach(x=>{const v=parseK(custom[x]||'0')||0;if(v){splits[x]=v;sum+=v}});if(sum!==amt)err=sum<amt?`${fmt(amt-sum)} is still unassigned. Custom amounts must add up to the total.`:`Custom amounts are ${fmt(sum-amt)} over the total.`}
      $('#exErr').textContent=err;if(err)return;
      const paid=$('#exPaid').value;
      if(old){Object.assign(old,{title,amount:amt,paidBy:paid,splits});if(receipt)old.receipt=receipt;else delete old.receipt;addAct(g,{actor:ME,kind:'edit',title});S.flash=old.id;closeModal();render();note(`Updated <b>${esc(title)}</b>`);return}
      const x={id:nid++,title,amount:amt,paidBy:paid,createdBy:ME,splits,t:Date.now()};if(receipt)x.receipt=receipt;
      g.expenses.push(x);addAct(g,{actor:paid,kind:'expense',title,amount:amt});S.flash=x.id;closeModal();render();note(`Added <b>${esc(title)}</b> <span class="amt">${fmt(amt)}</span>`);
    });
  });
}
function openDelete(id){
  const g=cur(),e=g.expenses.find(x=>x.id===id);if(!e)return;CC=g.currency;
  modal(`<h3>Delete this expense?</h3><p class="sub"><b>${esc(e.title)}</b> · <span class="amt">${fmt(e.amount)}</span>. Everyone's balances change, and the activity log records that you deleted it.</p>
   <div class="mact"><button type="button" class="btn btn-link" data-act="close-modal">Keep it</button><button type="button" class="btn btn-danger" id="delOk">Delete expense</button></div>`,m=>{
    $('#delOk').addEventListener('click',()=>{g.expenses=g.expenses.filter(x=>x.id!==id);S.open.delete(id);addAct(g,{actor:ME,kind:'delete',title:e.title,amount:e.amount});closeModal();render();note(`Deleted <b>${esc(e.title)}</b>`)});
  });
}
function openReceipt(id){
  const e=cur().expenses.find(x=>x.id===id);if(!e||!e.receipt)return;CC=cur().currency;
  modal(`<h3>Receipt</h3><p class="sub">${esc(e.title)} · <span class="amt">${fmt(e.amount)}</span></p><div class="rcview"><img src="${e.receipt}" alt="Receipt photo for ${esc(e.title)}"></div><div class="mact"><button type="button" class="btn" data-act="close-modal">Close</button></div>`);
}
function openPay(from,to,amount){
  const g=cur();CC=g.currency;
  modal(`<h3>Record a payment</h3><p class="sub"><b>${nm(from)}</b> ${from===ME?'pay':'pays'} <b>${nm(to)}</b>. Lower the amount if it was only part of the debt.</p>
   <form id="pyForm" novalidate><label for="pyAmt">Amount paid</label><div class="money"><span>${CUR[CC].sym}</span><input id="pyAmt" inputmode="decimal" value="${toIn(amount)}" autocomplete="off"></div>
   <p class="hint">Full debt: <span class="amt">${fmt(amount)}</span></p><p class="err" id="pyErr" role="alert"></p>
   <div class="mact"><button type="button" class="btn btn-link" data-act="close-modal">Cancel</button><button class="btn btn-primary">Record payment</button></div></form>`,m=>{
    $('#pyForm').addEventListener('submit',e=>{e.preventDefault();const v=parseK($('#pyAmt').value);
      if(!v){$('#pyErr').textContent='Enter an amount above zero.';return}
      if(v>amount){$('#pyErr').textContent=`That is more than the ${fmt(amount)} owed. Lower the amount.`;return}
      const row=document.querySelector(`.pay[data-key="${from}-${to}"],.bigpay[data-key="${from}-${to}"]`);closeModal();
      const apply=()=>{const p={id:nid++,from,to,amount:v,t:Date.now()};g.payments.push(p);addAct(g,{actor:from,kind:'payment',to,amount:v});S.flash=p.id;render();note(`<b>${nm(from)}</b> paid <b>${nm(to)}</b> <span class="amt">${fmt(v)}</span>`)};
      if(row){row.classList.add('struck');setTimeout(apply,750)}else apply();
    });
  });
}
function deniedView(){
  return shell(`<p class="eyebrow">Someone sent you a group link</p><h1 class="greet">You're not in this group.</h1>
   <p class="line">Only members can see its expenses, balances or payments. Ask someone in the group to invite you.</p>
   <div class="callout"><b>What the server did when this page asked for the group's data</b>
<pre class="log">getDocs(groups/4f8e…/expenses)         permission-denied  Missing or insufficient permissions
getDocs(groups/4f8e…/payments)         permission-denied  Missing or insufficient permissions
addDoc(groups/4f8e…/expenses)          permission-denied  Missing or insufficient permissions
call settleUp({ groupId: "4f8e…" })    permission-denied  not a member of this group</pre>
   <p class="tiny">Firestore refuses the whole request, reads and writes alike. Expenses and payments can only be written by Cloud Functions, so even a member cannot write them straight from the browser.</p></div>
   <div class="btns" style="margin-top:22px"><button class="btn btn-primary" data-act="nav" data-v="groups">Back to my groups</button></div>`,'');
}

/* simulated live update */
const LIVE=[['Taxi back to Lekki',650000],['Pure water and snacks',185000],['Beach chairs',400000],['Late night shawarma',920000]];
function simulateLive(){
  if(S.view!=='group'){note('Open a group first, then try again.');return}
  const g=cur(),who=g.members.find(m=>m!==ME);
  if(!who){note('Invite someone first so another person can add expenses.');return}
  const[t,a]=LIVE[S.liveCount++%LIVE.length],x={id:nid++,title:t,amount:a,paidBy:who,createdBy:who,splits:eq(a,g.members),t:Date.now()};
  g.expenses.push(x);addAct(g,{actor:who,kind:'expense',title:t,amount:a});S.flash=x.id;render();
  const s=$('#sync');s&&s.classList.add('blink');note(`<b>${nm(who)}</b> just added <b>${esc(t)}</b> <span class="amt">${fmt(a)}</span>`);
}
let liveTimer;
function scheduleLive(){clearTimeout(liveTimer);if(S.autoLive||S.gid!=='g1')return;liveTimer=setTimeout(()=>{if(S.view==='group'&&S.gid==='g1'&&!S.autoLive&&!$('.scrim')){S.autoLive=true;simulateLive()}},16000)}

/* data model */
const TABLES=[
 {n:'users',path:'users/{uid}',x:0,y:0,cols:[['uid','string','pk'],['displayName','string'],['email','string'],['photoURL','string'],['createdAt','timestamp']]},
 {n:'groups',path:'groups/{gid}',x:540,y:0,cols:[['gid','string','pk'],['name','string'],['cover','string'],['currency','string'],['createdBy','string','fk'],['memberIds','array'],['balances','map'],['createdAt','timestamp']]},
 {n:'invites',path:'invites/{token}',x:810,y:0,added:1,cols:[['token','string','pk'],['groupId','string','fk'],['email','string'],['invitedBy','string','fk'],['acceptedAt','timestamp'],['expiresAt','timestamp']]},
 {n:'members',path:'groups/{gid}/members/{uid}',x:270,y:230,cols:[['uid','string','pk fk'],['role','string'],['joinedAt','timestamp']]},
 {n:'expenses',path:'groups/{gid}/expenses/{eid}',x:540,y:270,cols:[['eid','string','pk'],['title','string'],['amountMinor','number'],['paidBy','string','fk'],['createdBy','string','fk'],['splits','map'],['splitUserIds','array'],['receiptPath','string'],['createdAt','timestamp']]},
 {n:'payments',path:'groups/{gid}/payments/{pid}',x:0,y:330,cols:[['pid','string','pk'],['from','string','fk'],['to','string','fk'],['amountMinor','number'],['createdAt','timestamp']]},
 {n:'activity',path:'groups/{gid}/activity/{aid}',x:270,y:500,stretch:1,cols:[['aid','string','pk'],['actorId','string','fk'],['kind','string'],['payload','map'],['createdAt','timestamp']]}
];
const RELS=[['groups.createdBy','users.uid'],['members.uid','users.uid'],['invites.groupId','groups.gid'],['invites.invitedBy','users.uid'],['expenses.paidBy','users.uid'],['expenses.createdBy','users.uid'],['payments.from','users.uid'],['payments.to','users.uid'],['activity.actorId','users.uid']];
function modelView(){
  const tbl=t=>`<div class="tbl ${t.stretch?'stretch':''}" data-t="${t.n}" style="left:${t.x}px;top:${t.y}px"><h4>${t.path||t.n}${t.added?'<small>for invites</small>':''}${t.stretch?'<small>stretch</small>':''}</h4>${t.cols.map(c=>`<div class="c" data-col="${t.n}.${c[0]}"><span class="n">${c[0]}</span><span class="ty">${c[1]}</span>${(c[2]||'').split(' ').filter(Boolean).map(k=>`<span class="k ${k}">${k.toUpperCase()}</span>`).join('')}</div>`).join('')}</div>`;
  const rls=[['users','You, and people who share a group with you.','Only your own document.'],['groups','Members (your uid is in memberIds).','Functions only. A function creates it and keeps balances up to date.'],['members','Members of the same group.','Functions only (create group, accept invite, leave, remove).'],['invites','Group owner.','Functions only. Accepting uses the token inside a function.'],['expenses','Members of the group.','Functions only. Each call checks you are a member, the payer is a member, and the splits add up to the amount.'],['payments','Members of the group.','Functions only, and never edited afterwards.'],['activity','Members of the group.','Functions only. Written in the same step as the change it describes.']];
  return shell(`<div class="model"><h1>Data model</h1><p class="lead">Six collections plus one stretch collection. Almost everything lives under a group, so one rule protects all of it: <code>isMember(gid)</code>, a security-rules check that the group's member document exists. Splits are a map inside each expense. Hover a collection to light up its links.</p>
   <div class="erd-scroll"><div class="erd" id="erd"><svg class="erd-svg" id="erdSvg" aria-hidden="true"></svg>${TABLES.map(tbl).join('')}</div></div>
   <div class="legend"><span>● many side of a link</span><span>○ one side of a link</span><span>All money fields are whole <code>number</code>s in the smallest unit (kobo, cents, pence), never decimals</span></div>
   <div class="sec"><h2>Who can see and change what (security rules)</h2></div><div class="tblwrap"><table class="rls"><thead><tr><th>Collection</th><th>Read</th><th>Write</th></tr></thead><tbody>${rls.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div>
   <div class="callout"><b>Settle-up lives on the server.</b> The <code>settleUp</code> Cloud Function takes a group id, checks the caller is a member, reads the group's balances and returns the fewest payments. The browser only shows the result. Writes that touch money (expenses, payments) also go through functions, so the totals and the security rules can't drift apart.</div>
   <div class="callout"><b>Rules that protect the money.</b> <code>amountMinor</code> must be a whole number above zero, splits must add up to the expense total, and an equal split gives the odd units to the first people so nothing is lost to rounding. A group has one currency, set at creation and locked after the first expense. Currencies like yen have no decimals, so the smallest unit is one yen.</div></div></div>`,'');
}
function drawLines(){
  const wrap=$('#erd'),svgEl=$('#erdSvg');if(!wrap)return;
  const W=wrap.getBoundingClientRect();let h='';
  const rect=el=>{const r=el.getBoundingClientRect();return{l:r.left-W.left,r:r.right-W.left,my:(r.top+r.bottom)/2-W.top}};
  RELS.forEach(([f,t])=>{
    const a=wrap.querySelector(`[data-col="${f}"]`),b=wrap.querySelector(`[data-col="${t}"]`);if(!a||!b)return;
    const ca=rect(a.closest('.tbl')),cb=rect(b.closest('.tbl')),ra=rect(a),rb=rect(b);let x1,x2,d1,d2;
    if(cb.l>ca.r-10){x1=ca.r;x2=cb.l;d1=1;d2=-1}else if(cb.r<ca.l+10){x1=ca.l;x2=cb.r;d1=-1;d2=1}else{x1=ca.r;x2=cb.r;d1=1;d2=1}
    const dx=Math.max(46,Math.abs(x2-x1)/2),y1=ra.my,y2=rb.my;
    h+=`<path data-tn="${f.split('.')[0]} ${t.split('.')[0]}" d="M${x1} ${y1} C${x1+d1*dx} ${y1},${x2+d2*dx} ${y2},${x2} ${y2}"/><circle class="many" cx="${x1}" cy="${y1}" r="3.5"/><circle class="one" cx="${x2}" cy="${y2}" r="3.5"/>`;
  });
  svgEl.setAttribute('width',W.width);svgEl.setAttribute('height',W.height);svgEl.innerHTML=h;
  wrap.querySelectorAll('.tbl').forEach(el=>{
    el.onmouseenter=()=>{svgEl.classList.add('dim');svgEl.querySelectorAll('path').forEach(p=>p.classList.toggle('on',p.dataset.tn.split(' ').includes(el.dataset.t)))};
    el.onmouseleave=()=>{svgEl.classList.remove('dim');svgEl.querySelectorAll('path').forEach(p=>p.classList.remove('on'))};
  });
}
addEventListener('resize',()=>{if(S.view==='model')drawLines()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(S.view==='model')drawLines()});
render();
</script>
